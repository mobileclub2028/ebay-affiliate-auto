name: daily-ebay-deals
on:
  schedule:
    - cron: "15 13 * * *"  # KST 22:15 매일
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python src/fetch_ebay.py
        env:
          EBAY_APP_ID: ${{ secrets.EBAY_APP_ID }}
          EBAY_CERT_ID: ${{ secrets.EBAY_CERT_ID }}
          EPN_CAMPID: ${{ secrets.EPN_CAMPID }}
      - run: python src/build_pages.py
      - run: python src/post_telegram.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - run: python src/post_bluesky.py
        env:
          BSKY_HANDLE: ${{ secrets.BSKY_HANDLE }}
          BSKY_APP_PASSWORD: ${{ secrets.BSKY_APP_PASSWORD }}
      - run: python src/gen_shorts.py
      - run: python src/send_shorts_tg.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - uses: actions/upload-artifact@v4
        with:
          name: shorts-video
          path: shorts/*.mp4
      - name: commit daily update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs shorts/*.txt 2>/dev/null || git add data docs
          git diff --cached --quiet && echo "no changes" && exit 0
          git commit -m "auto: daily deals update"
          for i in 1 2 3; do
            git pull --rebase -X theirs --autostash && git push && break
            echo "push retry $i"
            sleep 10
          done
