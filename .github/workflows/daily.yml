name: daily-ebay-deals
on:
  schedule:
    - cron: "15 13 * * *"  # KST 22:15 매일
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python src/fetch_ebay.py
        env:
          EBAY_APP_ID: ${{ secrets.EBAY_APP_ID }}
          EBAY_CERT_ID: ${{ secrets.EBAY_CERT_ID }}
          EPN_CAMPID: ${{ secrets.EPN_CAMPID }}
      - run: python src/build_pages.py
      - run: python src/post_telegram.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - run: python src/post_bluesky.py
        env:
          BSKY_HANDLE: ${{ secrets.BSKY_HANDLE }}
          BSKY_APP_PASSWORD: ${{ secrets.BSKY_APP_PASSWORD }}
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "auto: daily deals update"
          file_pattern: "data/* docs/*"
